<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfbfa">
<title>Siden findes ikke – Renacer</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&display=swap"></noscript>
<style>
:root{--bg:#fbfbfa;--ink:#121212;--muted:#6f6c67;--line:#e4e2dd;--acc:#a8854a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header,main{max-width:1240px;width:100%;margin:0 auto;padding:0 48px}
header{padding-top:30px}
.wordmark{font-family:"Italiana",serif;font-size:22px;letter-spacing:.32em}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-bottom:80px}
.code{font-family:"Italiana",serif;color:var(--acc);font-size:22px;letter-spacing:.2em}
h1{font-family:"Inter Tight",sans-serif;font-weight:500;font-size:clamp(44px,7vw,88px);letter-spacing:-.035em;line-height:1.02}
h1 em{font-family:"Italiana",serif;font-style:normal;color:var(--acc);font-weight:400}
p{color:var(--muted);max-width:440px}
.links{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
@media (max-width:900px){header,main{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header><a class="wordmark" href="/">RENACER</a></header>
<main>
 <div class="code">404</div>
 <h1>Siden findes <em>ikke.</em></h1>
 <p>Linket er måske forældet, eller adressen er skrevet forkert.</p>
 <div class="links"><a class="btn" href="/">Til forsiden</a><a class="btn ghost" href="/#kontakt">Kontakt os</a></div>
</main>
</body>
</html>
